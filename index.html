<html>
<script>
// Element Settings
const timerEnabled = true;
const serverstatusEnabled = true;

// Countdown ending
const targetDate = new Date("2026-11-19T12:00:00").getTime();

// Status URL
const url = "https://api.alcbgames.com/server/dustbyte/001.json";
</script>
<style>
  .countdown {
    display: flex;
    justify-content: center;
    gap: 20px;
    font-family: monospace;
}

.countdown div {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #171717;
    padding: 15px;
    border-radius: 10px;
    min-width: 65px;
}

.countdown span {
    font-size: 32px;
    color: white;
}

.countdown small {
    color: #999;
}

#status {
    font-weight: bold;
}

.operational {
    color: #4ade80;
}

.downtime {
    color: #ef4444;
}

.maintenance {
    color: #facc15;
}

.status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}
</style>
<head>
  <title>DUSTBYTE Playtest</title>
</head>
<body>
<div class="status">
<p id="version">Loading...</p>
<p id="status">Loading...</p>
<p id="message">Loading...</p>
</div>
<div class="countdown">
    <div>
        <span id="days">undef</span>
        <small>Days</small>
    </div>
    <div>
        <span id="hours">undef</span>
        <small>Hours</small>
    </div>
    <div>
        <span id="minutes">undef</span>
        <small>Minutes</small>
    </div>
    <div>
        <span id="seconds">undef</span>
        <small>Seconds</small>
    </div>
</div>
</body>
<script>

async function updateText() {
    try {
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("HTTP error: " + response.status);
        }

        const data = await response.json();

        // Update version
        document.getElementById("version").textContent =
            "Version: " + data.version;

        // Update message
        document.getElementById("message").textContent =
            data.message;

        // Update server status
        const statusElement = document.getElementById("status");
        const status = data.status.toLowerCase();

        if (status === "operational") {
            statusElement.textContent = "● Operational";
            statusElement.className = "operational";

        } else if (status === "downtime") {
            statusElement.textContent = "● Downtime";
            statusElement.className = "downtime";

        } else if (status === "maintenance") {
            statusElement.textContent = "● Maintenance";
            statusElement.className = "maintenance";

        } else {
            statusElement.textContent = "● Unknown";
            statusElement.className = "";
        }

    } catch (error) {
        console.error("Failed to fetch JSON:", error);
        document.getElementById("status").textContent = "● Connection Error";
        document.getElementById("status").className = "downtime";
    }
}

// Server status settings
if (serverstatusEnabled) {
    updateText();
    setInterval(updateText, 30000);
} else {
    document.querySelector(".status")?.remove();
}


// Countdown
let timer;

function updateCountdown() {
    const now = Date.now();
    const distance = targetDate - now;

    if (distance <= 0) {
        const countdown = document.querySelector(".countdown");

    if (countdown) {
      countdown.textContent = "Event started!";
    }
      
        clearInterval(timer);
        return;
    }

    const days = Math.floor(distance / 86400000);
    const hours = Math.floor((distance % 86400000) / 3600000);
    const minutes = Math.floor((distance % 3600000) / 60000);
    const seconds = Math.floor((distance % 60000) / 1000);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = String(hours).padStart(2, "0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
}

if (timerEnabled) {
    updateCountdown();
    timer = setInterval(updateCountdown, 1000);
} else {
    document.querySelector(".countdown")?.remove();
}

</script>
</html>
