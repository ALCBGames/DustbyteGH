<html>
<script>
// Countdown ending
const targetDate = new Date("2026-11-19T12:00:00").getTime();

// Enable or disable countdown
const timerEnabled = true;

// Status URL
const url = "https://api.alcbgames.com/version/dustbyte.json";
</script>
<style>
  .countdown {
    display: flex;
    justify-content: center;
    gap: 20px;
    font-family: monospace;
}

.countdown div {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #171717;
    padding: 15px;
    border-radius: 10px;
    min-width: 65px;
}

.countdown span {
    font-size: 32px;
    color: white;
}

.countdown small {
    color: #999;
}
</style>
<head>
  <title>DUSTBYTE Playtest</title>
</head>
<body>
<div class="countdown">
    <div>
        <span id="days">undef</span>
        <small>Days</small>
    </div>
    <div>
        <span id="hours">undef</span>
        <small>Hours</small>
    </div>
    <div>
        <span id="minutes">undef</span>
        <small>Minutes</small>
    </div>
    <div>
        <span id="seconds">undef</span>
        <small>Seconds</small>
    </div>
</div>
</body>
<script>
async function updateText() {
    try {
        const response = await fetch(url);
        const data = await response.json();

        document.getElementById("version").textContent =
            "Version: " + data.version;

        document.getElementById("status").textContent =
            "Status: " + data.status;

        document.getElementById("message").textContent =
            data.message;

    } catch (error) {
        console.error("Failed to fetch JSON:", error);
    }
}

// Update immediately
updateText();

// Update every 30 seconds
setInterval(updateText, 30000);
  
function updateCountdown() {
    const now = Date.now();
    const distance = targetDate - now;

    if (distance <= 0) {
        document.querySelector(".countdown").textContent = "Event started!";
        clearInterval(timer);
        return;
    }

    const days = Math.floor(distance / 86400000);
    const hours = Math.floor((distance % 86400000) / 3600000);
    const minutes = Math.floor((distance % 3600000) / 60000);
    const seconds = Math.floor((distance % 60000) / 1000);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = String(hours).padStart(2, "0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
}

if (timerEnabled) {
    updateCountdown();
    const timer = setInterval(updateCountdown, 1000);
} else {
    document.querySelector(".countdown")?.remove();
}
</script>
</html>
